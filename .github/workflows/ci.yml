name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  rust:
    name: Rust
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@fa04a1451ff1842e2626ccb99004d0195b455a88
        with:
          toolchain: stable
          components: rustfmt, clippy

      - name: Cache cargo
        uses: Swatinem/rust-cache@42dc69e1aa15d09112580998cf2ef0119e2e91ae # v2

      - name: Format
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: Forbid unsafe code
        run: |
          ! grep -R -n -E 'unsafe[[:space:]]*(\{|fn|impl|trait)' src tests benches

      - name: Test
        run: cargo test --all-targets

      - name: Build release
        run: cargo build --release

      - name: Benchmark smoke
        run: cargo bench --bench cli -- --test

      - name: Check documented refs
        run: ./target/release/driftless check

      - name: Check public symbol coverage
        run: ./target/release/driftless coverage --include src/
