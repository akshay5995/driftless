name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  build:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            archive: tar.gz
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            archive: tar.gz
          - os: macos-15-intel
            target: x86_64-apple-darwin
            archive: tar.gz
          - os: macos-15
            target: aarch64-apple-darwin
            archive: tar.gz
          - os: windows-2025
            target: x86_64-pc-windows-msvc
            archive: zip

    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@fa04a1451ff1842e2626ccb99004d0195b455a88
        with:
          toolchain: stable
          targets: ${{ matrix.target }}

      - name: Cache cargo
        uses: Swatinem/rust-cache@42dc69e1aa15d09112580998cf2ef0119e2e91ae # v2

      - name: Verify release tag matches Cargo version
        shell: bash
        run: |
          set -euo pipefail
          manifest_version="$(cargo pkgid | sed 's/.*#//')"
          tag_version="${GITHUB_REF_NAME#v}"
          if [[ "$manifest_version" != "$tag_version" ]]; then
            echo "Cargo.toml version ${manifest_version} does not match tag ${GITHUB_REF_NAME}" >&2
            exit 1
          fi

      - name: Verify crates.io package
        run: cargo package --locked

      - name: Build release binary
        run: cargo build --release --locked --target ${{ matrix.target }}

      - name: Smoke binary
        shell: bash
        run: |
          set -euo pipefail
          bin="target/${{ matrix.target }}/release/driftless"
          if [[ "${{ runner.os }}" == "Windows" ]]; then
            bin="${bin}.exe"
          fi
          "$bin" --help
          "$bin" --version

      - name: Package Unix binary
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          package="driftless-${version}-${{ matrix.target }}"
          mkdir -p "dist/${package}"
          cp "target/${{ matrix.target }}/release/driftless" "dist/${package}/"
          cp README.md "dist/${package}/"
          tar -C dist -czf "dist/${package}.tar.gz" "${package}"

      - name: Package Windows binary
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $version = ($env:GITHUB_REF_NAME).TrimStart("v")
          $package = "driftless-$version-${{ matrix.target }}"
          New-Item -ItemType Directory -Path "dist\$package" | Out-Null
          Copy-Item "target\${{ matrix.target }}\release\driftless.exe" "dist\$package\"
          Copy-Item "README.md" "dist\$package\"
          Compress-Archive -Path "dist\$package\*" -DestinationPath "dist\$package.zip"

      - name: Upload packaged binary
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: driftless-${{ matrix.target }}
          path: |
            dist/*.tar.gz
            dist/*.zip
          if-no-files-found: error

      - name: Attest packaged binary
        uses: actions/attest-build-provenance@96b4a1ef7235a096b17240c259729fdd70c83d45 # v2
        with:
          subject-path: dist/*.${{ matrix.archive }}

  release:
    name: Publish GitHub release
    runs-on: ubuntu-24.04
    needs: build

    steps:
      - name: Download packaged binaries
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          path: dist
          merge-multiple: true

      - name: Generate checksums
        shell: bash
        run: |
          set -euo pipefail
          cd dist
          shasum -a 256 driftless-* > SHA256SUMS

      - name: Attest checksums
        uses: actions/attest-build-provenance@96b4a1ef7235a096b17240c259729fdd70c83d45 # v2
        with:
          subject-path: dist/SHA256SUMS

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          gh release create "${GITHUB_REF_NAME}" dist/* \
            --verify-tag \
            --fail-on-no-commits \
            --title "Driftless ${version}" \
            --notes "Automated Driftless release for ${GITHUB_REF_NAME}."
