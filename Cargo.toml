[package]
name = "driftless"
version = "0.1.0"
edition = "2021"
rust-version = "1.75"
license = "MIT"
description = "Keep Markdown docs linked to code so drift is caught while you work."
readme = "README.md"
documentation = "https://docs.rs/driftless"
keywords = ["documentation", "markdown", "cli", "tree-sitter", "drift"]
categories = ["command-line-utilities", "development-tools"]

[[bin]]
name = "driftless"
path = "src/main.rs"

[dependencies]
clap = { version = "=4.4.18", features = ["derive"] }
pulldown-cmark = "=0.9.6"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
walkdir = "2"
tree-sitter = "=0.25.8"
tree-sitter-go = "=0.25.0"
tree-sitter-java = "=0.23.5"
tree-sitter-kotlin-ng = "=1.1.0"
tree-sitter-python = "=0.25.0"
tree-sitter-ruby = "=0.23.1"
tree-sitter-rust = "=0.24.2"
tree-sitter-typescript = "=0.23.2"
tokio = { version = "=1.36.0", features = ["rt-multi-thread", "macros", "io-std"] }
tower-lsp = "=0.20.0"
url = "=2.4.1"

[dev-dependencies]
criterion = "=0.5.1"
tempfile = "3"

[[bench]]
name = "cli"
harness = false

[profile.release]
lto = true

[profile.bench]
lto = true
